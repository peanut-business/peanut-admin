name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.paths.outputs.server }}
      web: ${{ steps.paths.outputs.web }}
      pc: ${{ steps.paths.outputs.pc }}
      uniapp: ${{ steps.paths.outputs.uniapp }}
      docs_site: ${{ steps.paths.outputs.docs_site }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify affected products
        id: paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            for output in server web pc uniapp docs_site; do
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")"
          matches() {
            grep -Eq "$1" <<< "$changed"
          }

          server_changed="$(grep -E '^server/' <<< "$changed" | grep -Ev '^(server/app/common/service/scaffold/ApplicationCreator\.php|server/tests/Productization/CreateApplicationTest\.php)$' || true)"
          [[ -n "$server_changed" || "$(grep -E '^(scripts/ci-server-check\.sh|scripts/check-admin-api-permissions\.php)$' <<< "$changed" || true)" != "" ]] && echo 'server=true' >> "$GITHUB_OUTPUT" || echo 'server=false' >> "$GITHUB_OUTPUT"
          matches '^(web/|scripts/sync-brand-assets\.mjs$)' && echo 'web=true' >> "$GITHUB_OUTPUT" || echo 'web=false' >> "$GITHUB_OUTPUT"
          matches '^pc/' && echo 'pc=true' >> "$GITHUB_OUTPUT" || echo 'pc=false' >> "$GITHUB_OUTPUT"
          matches '^uniapp/' && echo 'uniapp=true' >> "$GITHUB_OUTPUT" || echo 'uniapp=false' >> "$GITHUB_OUTPUT"
          matches '^docs-site/' && echo 'docs_site=true' >> "$GITHUB_OUTPUT" || echo 'docs_site=false' >> "$GITHUB_OUTPUT"

  php:
    name: PHP 8.3
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mt02_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmt02_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      MYSQL_ROOT_PASSWORD: mt02_root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Validate Composer manifest
        working-directory: server
        run: composer validate --strict

      - name: Install Composer dependencies
        working-directory: server
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run focused server gates
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.sha }}
          CI_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          CI_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: ./scripts/ci-server-check.sh --fast

      - name: Run stage server gates
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/ci-server-check.sh --full

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Check generated brand files
        run: node scripts/sync-brand-assets.mjs --check
      - name: Build
        working-directory: web
        run: pnpm run build
      - name: Test Web policies and form helpers
        working-directory: web
        shell: bash
        run: |
          test_output="$(mktemp -d)"
          ./node_modules/.bin/tsc --target ES2020 --module commonjs --moduleResolution node --strict --skipLibCheck \
            --outDir "${test_output}" \
            src/core/permission-policy.ts \
            src/core/plugin-contribution-policy.ts \
            src/views/system/dept/parent-options.ts \
            tests/Productization/permission-policy.test.ts \
            tests/Productization/plugin-contribution.test.ts \
            tests/Productization/department-parent-options.test.ts
          node "${test_output}/tests/Productization/permission-policy.test.js"
          node "${test_output}/tests/Productization/plugin-contribution.test.js"
          node "${test_output}/tests/Productization/department-parent-options.test.js"

  pc:
    name: PC
    needs: changes
    if: needs.changes.outputs.pc == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - name: Install dependencies
        working-directory: pc
        run: npm ci
      - name: Typecheck
        working-directory: pc
        run: npm run typecheck
      - name: Generate
        working-directory: pc
        run: npm run generate

  uniapp:
    name: UniApp
    needs: changes
    if: needs.changes.outputs.uniapp == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: uniapp/package-lock.json
      - name: Install dependencies
        working-directory: uniapp
        run: npm ci
      - name: Typecheck
        working-directory: uniapp
        run: npm run type-check
      - name: Build H5
        working-directory: uniapp
        run: npm run build:h5

  docs-site:
    name: Docs site
    needs: changes
    if: needs.changes.outputs.docs_site == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: docs-site
        run: pnpm run build
