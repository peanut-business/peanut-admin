name: peanut-admin-production

x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  PEANUT_DEPLOYMENT_TARGET: ${PEANUT_DEPLOYMENT_TARGET:?set local-production-preview, production, or a registered production candidate target}
  PEANUT_DATABASE_RESOURCE_ID: ${PEANUT_DATABASE_RESOURCE_ID:?set the registered production database resource id}
  DB_HOST: ${DB_HOST:?set DB_HOST in .env}
  DB_PORT: ${DB_PORT:-3306}
  DB_NAME: ${DB_NAME:-peanut_admin}
  DB_USER: ${DB_USER:-peanut_admin}
  DB_PASS: ${DB_PASS:?set DB_PASS in .env}
  DB_PREFIX: pa_
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JWT_EXPIRE: ${JWT_EXPIRE:-7200}
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:?set DEPLOYMENT_MODE to standalone or multi-tenant}
  PUBLIC_DEFAULT_TENANT_FALLBACK: ${PUBLIC_DEFAULT_TENANT_FALLBACK:-true}
  TENANT_IDENTIFIER_HMAC_KEY: ${TENANT_IDENTIFIER_HMAC_KEY:?set TENANT_IDENTIFIER_HMAC_KEY in .env}
  PLATFORM_IDENTIFIER_HMAC_KEY: ${PLATFORM_IDENTIFIER_HMAC_KEY:?set PLATFORM_IDENTIFIER_HMAC_KEY in .env}
  PLATFORM_HOSTS: ${PLATFORM_HOSTS:-}
  TENANT_ADMIN_HOSTS: ${TENANT_ADMIN_HOSTS:-}
  OWNER_INVITATION_DELIVERY_MODE: ${OWNER_INVITATION_DELIVERY_MODE:-auto}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-build-proxy: &build-proxy
  HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
  HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
  ALL_PROXY: ${BUILD_ALL_PROXY:-}
  NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1}
  http_proxy: ${BUILD_HTTP_PROXY:-}
  https_proxy: ${BUILD_HTTPS_PROXY:-}
  all_proxy: ${BUILD_ALL_PROXY:-}
  no_proxy: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1}

x-build-hosts: &build-hosts
  - "host.docker.internal:host-gateway"

services:
  php:
    image: ${PHP_IMAGE:-peanut-admin-php:production}
    build:
      context: ..
      dockerfile: deploy/docker/production.Dockerfile
      target: php
      args: *build-proxy
      extra_hosts: *build-hosts
    restart: unless-stopped
    command: ["/usr/local/bin/peanut-php-entrypoint"]
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    environment:
      <<: *app-environment
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-}
      PLATFORM_INITIAL_EMAIL: ${PLATFORM_INITIAL_EMAIL:-}
      PLATFORM_INITIAL_PASSWORD: ${PLATFORM_INITIAL_PASSWORD:-}
      PEANUT_DEMO_MODE: ${PEANUT_DEMO_MODE:-disabled}
      PEANUT_DEMO_TENANT_A_EMAIL: ${PEANUT_DEMO_TENANT_A_EMAIL:-}
      PEANUT_DEMO_TENANT_B_EMAIL: ${PEANUT_DEMO_TENANT_B_EMAIL:-}
      PEANUT_DEMO_SHARED_PASSWORD: ${PEANUT_DEMO_SHARED_PASSWORD:-}
      PEANUT_DEMO_TENANT_A_HOST: ${PEANUT_DEMO_TENANT_A_HOST:-}
      PEANUT_DEMO_TENANT_B_HOST: ${PEANUT_DEMO_TENANT_B_HOST:-}
      PEANUT_DEMO_DOCS_URL: ${PEANUT_DEMO_DOCS_URL:-}
    volumes:
      - php-runtime:/var/www/peanut-admin/server/runtime
      - php-storage:/var/www/peanut-admin/server/public/storage
      - php-private-storage:/var/www/peanut-admin/server/private/storage
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/peanut-ready && php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  nginx:
    image: ${NGINX_IMAGE:-peanut-admin-nginx:production}
    build:
      context: ..
      dockerfile: deploy/docker/production.Dockerfile
      target: nginx
      args: *build-proxy
      extra_hosts: *build-hosts
    restart: unless-stopped
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:?set DEPLOYMENT_MODE to standalone or multi-tenant}
    ports:
      - "127.0.0.1:${HTTP_PORT:-18092}:80"
    volumes:
      - php-storage:/var/www/peanut-admin/server/public/storage:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  mysql:
    image: mysql:8.4
    profiles: [bundled-db]
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-peanut_admin}
      MYSQL_USER: ${DB_USER:-peanut_admin}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  # The scheduler is part of the backend runtime and is enabled by default.
  cron:
    image: ${PHP_IMAGE:-peanut-admin-php:production}
    pull_policy: never
    restart: unless-stopped
    working_dir: /var/www/peanut-admin/server
    command: ["sh", "-c", "while :; do php think crontab; sleep 60; done"]
    environment: *app-environment
    volumes:
      - php-runtime:/var/www/peanut-admin/server/runtime
      - php-storage:/var/www/peanut-admin/server/public/storage
      - php-private-storage:/var/www/peanut-admin/server/private/storage
    depends_on:
      php:
        condition: service_healthy
    logging: *default-logging

  # Redis is intentionally opt-in and has no dependency edge from app services.
  redis:
    image: redis:7-alpine
    profiles: [redis]
    restart: unless-stopped
    logging: *default-logging

volumes:
  mysql-data:
  php-runtime:
  php-storage:
  php-private-storage:
