server {
    listen 80;
    server_name _;

    root /var/www/peanut-admin/server/public;
    index index.html index.php;
    charset utf-8;
    client_max_body_size 20m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Keep the bare host useful while making /admin/ the canonical SPA base.
    location = / {
        return 302 /admin/;
    }

    location = /admin {
        return 302 /admin/;
    }

    location = /mobile {
        return 302 /mobile/;
    }

    location = /pc {
        return 302 /pc/;
    }

    # Legacy ThinkPHP admin login endpoints live under /admin/ and must not be
    # mistaken for SPA routes. The current frontend API uses /api/admin/.
    location ~ ^/admin/login/(?:login|logout)/?$ {
        try_files $uri /index.php?s=$uri&$query_string;
    }

    # Preserve the original route for ThinkPHP. Redirecting only to index.php
    # makes PHP-FPM see the root route and return the framework welcome page.
    location ^~ /api/ {
        try_files $uri /index.php?s=$uri&$query_string;
    }

    # The admin SPA and its history fallback are isolated below /admin/.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # UniApp H5 is a static SPA built below /mobile/.
    location /mobile/ {
        try_files $uri $uri/ /mobile/index.html;
    }

    # The generated PC SPA is isolated below /pc/.
    location /pc/ {
        try_files $uri $uri/ /pc/index.html;
    }

    location = /favicon.svg {
        try_files /admin/favicon.svg =404;
    }

    location / {
        try_files $uri $uri/ /admin/index.html;
    }

    # Uploaded/exported files are never interpreted as PHP.
    location ^~ /storage/ {
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
    }

    location ~ /\. {
        deny all;
    }
}
