name: peanut-admin-development

x-node-environment: &node-environment
  COREPACK_ENABLE_PROJECT_SPEC: "0"
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""

services:
  php:
    image: peanut-admin-php:dev
    build:
      context: ..
      dockerfile: deploy/docker/php-development.Dockerfile
    working_dir: /workspace/server
    command: ["/usr/local/bin/peanut-development-entrypoint"]
    environment:
      APP_ENV: development
      APP_DEBUG: ${APP_DEBUG:-true}
      PHP_APP_DEBUG: ${APP_DEBUG:-true}
      PEANUT_DEPLOYMENT_TARGET: local-development
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:?set DEPLOYMENT_MODE}
      TENANT_IDENTIFIER_HMAC_KEY: ${TENANT_IDENTIFIER_HMAC_KEY:?set TENANT_IDENTIFIER_HMAC_KEY}
      PLATFORM_IDENTIFIER_HMAC_KEY: ${PLATFORM_IDENTIFIER_HMAC_KEY:?set PLATFORM_IDENTIFIER_HMAC_KEY}
      PEANUT_DATABASE_RESOURCE_ID: ${PEANUT_DATABASE_RESOURCE_ID:?set the registered database resource id}
      DB_HOST: ${DB_HOST:?set the registered database host}
      DB_PORT: ${DB_PORT:?set the registered database port}
      DB_NAME: ${DB_NAME:?set the registered database name}
      DB_USER: ${DB_USER:?set the registered database user}
      DB_PASS: ${DB_PASS:?set the database password}
      DB_PREFIX: ${DB_PREFIX:-pa_}
      PHP_DB_HOST: ${DB_HOST:?set the registered database host}
      PHP_DB_PORT: ${DB_PORT:?set the registered database port}
      PHP_DB_NAME: ${DB_NAME:?set the registered database name}
      PHP_DB_USER: ${DB_USER:?set the registered database user}
      PHP_DB_PASS: ${DB_PASS:?set the database password}
      PHP_DB_PREFIX: ${DB_PREFIX:-pa_}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret}
      PHP_JWT_SECRET: ${JWT_SECRET:-development-only-secret}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:?set ADMIN_INITIAL_EMAIL in the local env file}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD in the local env file}
      COMPOSER_ALLOW_SUPERUSER: "1"
    volumes:
      - ../server:/workspace/server
      - ./docker/container.env:/workspace/server/.env:ro
      - ./docker/php-development-entrypoint.sh:/usr/local/bin/peanut-development-entrypoint:ro
    ports:
      - "${PHP_PORT:-8000}:8000"
  web:
    image: node:20.19.4-bookworm-slim
    working_dir: /workspace/web
    command: ["sh", "-c", "test -x node_modules/.bin/vite || (corepack enable && corepack prepare pnpm@9.15.6 --activate && pnpm install --frozen-lockfile); exec node node_modules/vite/bin/vite.js --config ./config/vite.config.dev.ts --host 0.0.0.0"]
    environment:
      <<: *node-environment
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      VITE_API_PROXY_TARGET: http://php:8000
      VITE_OPEN_BROWSER: "false"
    volumes:
      - ../web:/workspace/web
      - web-node-modules:/workspace/web/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"

  pc:
    image: node:20.19.4-bookworm-slim
    working_dir: /workspace/pc
    command: ["sh", "-c", "test -x node_modules/.bin/nuxt || npm ci; exec node node_modules/nuxt/bin/nuxt.mjs dev --port 3100 --host 0.0.0.0"]
    environment:
      <<: *node-environment
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      NUXT_DEV_PROXY_TARGET: http://php:8000/api
    volumes:
      - ../pc:/workspace/pc
      - pc-node-modules:/workspace/pc/node_modules
    ports:
      - "${PC_PORT:-3100}:3100"

  mobile:
    image: node:20.19.4-bookworm-slim
    working_dir: /workspace/uniapp
    command: ["sh", "-c", "test -x node_modules/.bin/uni || npm ci; exec node node_modules/@dcloudio/vite-plugin-uni/bin/uni.js --host 0.0.0.0 --port 5174"]
    environment:
      <<: *node-environment
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      VITE_API_PROXY_TARGET: http://php:8000
    volumes:
      - ../uniapp:/workspace/uniapp
      - mobile-node-modules:/workspace/uniapp/node_modules
    ports:
      - "${MOBILE_PORT:-5174}:5174"

  docs:
    image: node:20.19.4-bookworm-slim
    working_dir: /workspace/docs-site
    command: ["sh", "-c", "test -x node_modules/.bin/vitepress || (corepack enable && corepack prepare pnpm@9.15.6 --activate && pnpm install --frozen-lockfile); node scripts/sync-legal-assets.mjs; exec node node_modules/vitepress/bin/vitepress.js dev . --host 0.0.0.0 --port 4173"]
    environment:
      <<: *node-environment
      VITEPRESS_DISABLE_GIT: "true"
    volumes:
      - ../docs-site:/workspace/docs-site
      - ../LICENSE:/workspace/LICENSE:ro
      - ../NOTICE:/workspace/NOTICE:ro
      - ../THIRD_PARTY_NOTICES.md:/workspace/THIRD_PARTY_NOTICES.md:ro
      - ../RELEASE_SBOM.spdx.json:/workspace/RELEASE_SBOM.spdx.json:ro
      - ../CHANGELOG.md:/workspace/CHANGELOG.md:ro
      - ../RELEASE_METADATA.json:/workspace/RELEASE_METADATA.json:ro
      - docs-node-modules:/workspace/docs-site/node_modules
    ports:
      - "${DOCS_PORT:-4173}:4173"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${DEV_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/development.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - web
      - pc
      - mobile

  # Redis is opt-in for experiments; no application service depends on it.
  redis:
    image: redis:7-alpine
    profiles: [redis]

volumes:
  web-node-modules:
  pc-node-modules:
  mobile-node-modules:
  docs-node-modules:
