name: peanut-admin-development

x-node-environment: &node-environment
  COREPACK_ENABLE_PROJECT_SPEC: "0"
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  NO_PROXY: "host.docker.internal,192.168.192.2,127.0.0.1,localhost"
  no_proxy: "host.docker.internal,192.168.192.2,127.0.0.1,localhost"

services:
  web:
    image: node:20.19.4-bookworm-slim
    working_dir: /workspace/web
    command: ["sh", "-c", "test -x node_modules/.bin/vite || (corepack enable && corepack prepare pnpm@9.15.6 --activate && pnpm install --frozen-lockfile); exec node node_modules/vite/bin/vite.js --config ./config/vite.config.dev.ts --host 0.0.0.0 --port 5173"]
    environment:
      <<: *node-environment
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      VITE_API_PROXY_TARGET: http://host.docker.internal:${PHP_PORT:?set the registered host PHP port}
      VITE_OPEN_BROWSER: "false"
    volumes:
      - ../web:/workspace/web
      - web-node-modules:/workspace/web/node_modules
    ports:
      - "127.0.0.1:${VITE_PORT:?set the registered admin port}:5173"

  pc:
    image: node:20.19.4-bookworm-slim
    working_dir: /workspace/pc
    command: ["sh", "-c", "test -x node_modules/.bin/nuxt || npm ci; exec node node_modules/nuxt/bin/nuxt.mjs dev --port 3100 --host 0.0.0.0"]
    environment:
      <<: *node-environment
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      NUXT_DEV_PROXY_TARGET: http://host.docker.internal:${PHP_PORT:?set the registered host PHP port}/api
      NUXT_DEV_PROXY_ORIGIN: http://host.docker.internal:${PHP_PORT:?set the registered host PHP port}
    volumes:
      - ../pc:/workspace/pc
      - pc-node-modules:/workspace/pc/node_modules
    ports:
      - "127.0.0.1:${PC_PORT:?set the registered PC port}:3100"

  mobile:
    image: node:20.19.4-bookworm-slim
    working_dir: /workspace/uniapp
    command: ["sh", "-c", "test -x node_modules/.bin/uni || npm ci; exec node node_modules/@dcloudio/vite-plugin-uni/bin/uni.js --host 0.0.0.0 --port 5174"]
    environment:
      <<: *node-environment
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      VITE_API_PROXY_TARGET: http://host.docker.internal:${PHP_PORT:?set the registered host PHP port}
    volumes:
      - ../uniapp:/workspace/uniapp
      - mobile-node-modules:/workspace/uniapp/node_modules
    ports:
      - "127.0.0.1:${MOBILE_PORT:?set the registered mobile port}:5174"

  docs:
    image: node:20.19.4-bookworm-slim
    working_dir: /workspace/docs-site
    command: ["sh", "-c", "test -x node_modules/.bin/vitepress || (corepack enable && corepack prepare pnpm@9.15.6 --activate && pnpm install --frozen-lockfile); node scripts/sync-legal-assets.mjs; exec node node_modules/vitepress/bin/vitepress.js dev . --host 0.0.0.0 --port 4173"]
    environment:
      <<: *node-environment
      VITEPRESS_DISABLE_GIT: "true"
    volumes:
      - ../docs-site:/workspace/docs-site
      - ../LICENSE:/workspace/LICENSE:ro
      - ../NOTICE:/workspace/NOTICE:ro
      - ../THIRD_PARTY_NOTICES.md:/workspace/THIRD_PARTY_NOTICES.md:ro
      - ../RELEASE_SBOM.spdx.json:/workspace/RELEASE_SBOM.spdx.json:ro
      - ../CHANGELOG.md:/workspace/CHANGELOG.md:ro
      - ../RELEASE_METADATA.json:/workspace/RELEASE_METADATA.json:ro
      - docs-node-modules:/workspace/docs-site/node_modules
    ports:
      - "127.0.0.1:${DOCS_PORT:?set the registered docs port}:4173"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:?set the registered development gateway port}:80"
    volumes:
      - ./nginx/development.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      PEANUT_API_HOST: host.docker.internal
      PEANUT_API_PORT: ${PHP_PORT:?set the registered host PHP port}
      NGINX_ENVSUBST_FILTER: ^PEANUT_API_
    depends_on:
      - web
      - pc
      - mobile

  # Redis is opt-in for experiments; no application service depends on it.
  redis:
    image: redis:7-alpine
    profiles: [redis]
    ports:
      - "127.0.0.1:${REDIS_PORT:?set the local Redis port}:6379"

volumes:
  web-node-modules:
  pc-node-modules:
  mobile-node-modules:
  docs-node-modules:
