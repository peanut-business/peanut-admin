name: peanut-admin-development

services:
  php:
    build:
      context: ..
      dockerfile: deploy/docker/php-development.Dockerfile
    working_dir: /workspace/server
    command: ["sh", "-c", "composer install --no-interaction --prefer-dist && php think run --host=0.0.0.0 --port=8000"]
    environment:
      APP_ENV: development
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-peanut_admin}
      DB_USER: ${DB_USER:-peanut_admin}
      DB_PASS: ${DB_PASS:-peanut_admin_change_me}
      DB_PREFIX: ${DB_PREFIX:-pa_}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret}
      COMPOSER_ALLOW_SUPERUSER: "1"
    volumes:
      - ../server:/workspace/server
    ports:
      - "${PHP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: node:20-bookworm
    working_dir: /workspace/web
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"]
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    volumes:
      - ../web:/workspace/web
      - web-node-modules:/workspace/web/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/development.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - web

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-peanut_admin}
      MYSQL_USER: ${DB_USER:-peanut_admin}
      MYSQL_PASSWORD: ${DB_PASS:-peanut_admin_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Redis is opt-in for experiments; no application service depends on it.
  redis:
    image: redis:7-alpine
    profiles: [redis]

volumes:
  mysql-data:
  web-node-modules:
