name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  php:
    name: PHP 8.3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Validate Composer manifest
        working-directory: server
        run: composer validate --strict

      - name: Install Composer dependencies
        working-directory: server
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        run: find server/app server/config server/database server/route -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test website settings contract
        working-directory: server
        run: php tests/Productization/WebsiteConfigServiceTest.php

      - name: Test admin permission Host
        working-directory: server
        run: php tests/Productization/AdminPermissionHostTest.php

      - name: Test reference codes Host ownership
        working-directory: server
        run: php tests/Productization/ReferenceCodesHostTest.php

      - name: Test file media Host ownership
        working-directory: server
        run: php tests/Productization/FileMediaHostTest.php

      - name: Test operations Host ownership
        working-directory: server
        run: php tests/Productization/OpsHostTest.php

      - name: Test member finance Host ownership
        working-directory: server
        run: php tests/Productization/MemberFinanceHostTest.php

      - name: Test content decoration Host ownership
        working-directory: server
        run: php tests/Productization/ContentDecorationHostTest.php

      - name: Test notification Host ownership
        working-directory: server
        run: php tests/Productization/NotificationHostTest.php

      - name: Test payment Host ownership
        working-directory: server
        run: php tests/Productization/PaymentHostTest.php

      - name: Test OAuth and channel Host ownership
        working-directory: server
        run: php tests/Productization/OAuthChannelHostTest.php

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        run: pnpm run build

      - name: Test permission policy
        working-directory: web
        shell: bash
        run: |
          test_output="$(mktemp -d)"
          ./node_modules/.bin/tsc --target ES2020 --module commonjs --moduleResolution node --strict --skipLibCheck \
            --outDir "${test_output}" src/core/permission-policy.ts tests/Productization/permission-policy.test.ts
          node "${test_output}/tests/Productization/permission-policy.test.js"

  pc:
    name: PC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pc/package-lock.json

      - name: Install dependencies
        working-directory: pc
        run: npm ci

      - name: Typecheck
        working-directory: pc
        run: npm run typecheck

      - name: Generate
        working-directory: pc
        run: npm run generate

  uniapp:
    name: UniApp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: uniapp/package-lock.json

      - name: Install dependencies
        working-directory: uniapp
        run: npm ci

      - name: Typecheck
        working-directory: uniapp
        run: npm run type-check

      - name: Build H5
        working-directory: uniapp
        run: npm run build:h5

  docs-site:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: docs-site
        run: pnpm run build
