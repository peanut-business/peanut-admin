name: Product capability ledger

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'docs/product-status/**'
      - 'scripts/check-product-capability-ledger'
      - '.github/workflows/product-capability-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-ledger:
    name: Product capability ledger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate internal capability facts and rendered status
        run: php scripts/check-product-capability-ledger
