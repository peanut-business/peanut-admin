name: Documentation site

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'scripts/docs-governance'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCS_SITE_URL: https://peanut-admin-doc.007345.xyz
  DOCS_PROJECT: peanut-admin-docs

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          PEANUT_DOCS_SITE_URL: ${{ env.DOCS_SITE_URL }}
        run: |
          ./scripts/docs-governance check
          pnpm --dir docs-site run build

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: peanut-admin-docs-${{ github.sha }}
          path: docs-site/.vitepress/dist

  deploy:
    name: Publish documentation site
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    permissions:
      contents: read
    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: peanut-admin-docs-${{ github.sha }}
          path: docs-site/.vitepress/dist
      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@3.114.14 pages deploy docs-site/.vitepress/dist --project-name "$DOCS_PROJECT" --branch main
      - name: Report deferred publish
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo 'Cloudflare credentials are not configured; build artifact is ready for the Pages integration.'
