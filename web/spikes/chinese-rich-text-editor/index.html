<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中文富文本编辑器 Spike</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">临时技术 Spike</p>
        <h1>中文新闻稿编辑器</h1>
        <p>验证输入、结构化文档、媒体引用、评论锚点与同一稿件的实时协同；不包含工作流。</p>
      </header>

      <section class="editor-card" aria-labelledby="editor-heading">
        <div class="collaboration-row">
          <h2 id="editor-heading">稿件正文 · <span id="collaboration-role"></span></h2>
          <div class="collaboration-actions">
            <output id="collaboration-status" role="status" aria-live="polite">连接中</output>
            <button id="disconnect-collaboration" type="button">模拟断线</button>
            <button id="reconnect-collaboration" type="button">重新连接</button>
          </div>
        </div>
        <div class="toolbar" role="toolbar" aria-label="正文格式">
          <button type="button" data-command="heading">标题</button>
          <button type="button" data-command="paragraph">段落</button>
          <button type="button" data-command="bullet">无序列表</button>
          <button type="button" data-command="ordered">有序列表</button>
          <button type="button" data-command="undo">撤销</button>
          <button type="button" data-command="redo">重做</button>
        </div>

        <div class="control-row">
          <label for="link-url">链接</label>
          <input id="link-url" type="url" value="https://example.com/news" />
          <button id="set-link" type="button">应用到选区</button>
        </div>

        <div class="control-row">
          <label for="media-ref">媒体引用</label>
          <input id="media-ref" value="asset:image:001" />
          <select id="media-kind" aria-label="媒体类型">
            <option value="image">图片</option>
            <option value="video">视频</option>
            <option value="audio">音频</option>
          </select>
          <button id="insert-media" type="button">插入占位</button>
        </div>

        <div id="editor"></div>
        <div class="anchor-row">
          <button id="add-comment" type="button">为选区添加评论锚点</button>
          <output id="anchor-status" aria-live="polite">尚未创建锚点</output>
        </div>
      </section>

      <section class="result-card" aria-labelledby="result-heading">
        <div class="section-heading">
          <h2 id="result-heading">版本化文档 JSON</h2>
          <button id="run-check" type="button">运行聚焦检查</button>
        </div>
        <p id="check-status" role="status" aria-live="polite">尚未运行</p>
        <pre id="document-json" tabindex="0"></pre>
      </section>

      <section class="result-card" aria-labelledby="legacy-heading">
        <h2 id="legacy-heading">旧版文档只读渲染</h2>
        <div id="legacy-render" class="readonly" aria-label="旧版稿件，只读"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
