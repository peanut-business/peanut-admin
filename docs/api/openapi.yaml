openapi: 3.0.3
info:
  title: Peanut Admin HTTP API
  version: 3.0.0
  description: >-
    Application HTTP contract for the identity, Tenant, article, file and
    notification entry points. Runtime authorization and Tenant binding remain
    enforced by the server middleware.
servers:
  - url: /
tags:
  - name: Auth
  - name: Tenant
  - name: Article
  - name: File
  - name: Notice
  - name: Readiness
  - name: PlatformOps
paths:
  /api/user/login:
    post:
      tags: [Auth]
      operationId: userLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
  /api/tenant/session/select:
    post:
      tags: [Tenant]
      operationId: selectTenant
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantSelectRequest'}
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
  /api/article/lists:
    get:
      tags: [Article]
      operationId: listArticles
      parameters:
        - {$ref: '#/components/parameters/PageNo'}
        - {$ref: '#/components/parameters/PageSize'}
        - in: query
          name: cid
          schema: {type: integer, minimum: 0}
        - in: query
          name: keyword
          schema: {type: string}
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
  /api/article/detail:
    get:
      tags: [Article]
      operationId: articleDetail
      parameters:
        - in: query
          name: id
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
  /official.file.upload.file:
    post:
      tags: [File]
      operationId: uploadFile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                cid: {type: integer, minimum: 0}
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
  /official.file.list:
    get:
      tags: [File]
      operationId: listFiles
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PageNo'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
  /api/sms/send:
    post:
      tags: [Notice]
      operationId: sendVerificationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scene]
              properties:
                scene: {type: string}
                mobile: {type: string}
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
  /api/admin/readiness/checklist:
    get:
      tags: [Readiness]
      operationId: getFirstRunReadinessChecklist
      description: >-
        Returns a Tenant-safe, read-only projection of first-run readiness.
        Configured values are not promoted to external connectivity or
        production qualification, and infrastructure details are omitted.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Readiness checklist
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessChecklistResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
        '403': {$ref: '#/components/responses/ApiResponse'}
  /api/platform/v1/ops/backups:
    get:
      tags: [PlatformOps]
      operationId: getPlatformBackupCenter
      description: >-
        Returns the fixed backup Provider, the latest verified path-free
        manifest projection, and at most 20 recent backup tasks.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
        '403': {$ref: '#/components/responses/ApiResponse'}
  /api/platform/v1/ops/upgrade-readiness:
    get:
      tags: [PlatformOps]
      operationId: getPlatformUpgradeReadiness
      description: >-
        Returns the read-only source/target, migration, Module, scaffold,
        backup, restore-evidence and maintenance-window projection. The target
        is accepted only from the fixed deployment-staged bundle; the request
        cannot supply a path, URL, command, release key, or credential.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
        '403': {$ref: '#/components/responses/ApiResponse'}
  /api/platform/v1/ops/upgrades:
    get:
      tags: [PlatformOps]
      operationId: getPlatformUpgradeExecutions
      description: >-
        Returns at most ten application upgrade tasks with immutable source and
        target identities, ordered step status, stop code and recovery pointer.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
        '403': {$ref: '#/components/responses/ApiResponse'}
  /api/platform/v1/ops/providers:
    get:
      tags: [PlatformOps]
      operationId: getPlatformProviderQualifications
      description: >-
        Returns a secret-free, read-only aggregation of configured,
        connectivity, callback, credential-rotation, production qualification
        and recent failure states. Reading this endpoint never runs a probe,
        sends a message, or performs a financial operation.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Provider qualification snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProviderQualificationResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
        '403': {$ref: '#/components/responses/ApiResponse'}
  /api/platform/v1/ops/maintenance:
    get:
      tags: [PlatformOps]
      operationId: getPlatformMaintenanceWindow
      description: Returns the current scheduled or active maintenance window.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
        '403': {$ref: '#/components/responses/ApiResponse'}
    put:
      tags: [PlatformOps]
      operationId: schedulePlatformMaintenanceWindow
      description: >-
        Schedules the sole maintenance window. Once its time range is active,
        all HTTP mutation routes except the two maintenance-control routes are
        rejected and audited.
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string, pattern: '^"rev-[0-9]+"$'}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 8, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformMaintenanceScheduleRequest'}
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
        '400': {$ref: '#/components/responses/ApiResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
        '403': {$ref: '#/components/responses/ApiResponse'}
        '409': {$ref: '#/components/responses/ApiResponse'}
  /api/platform/v1/ops/maintenance/{maintenance_key}/close:
    post:
      tags: [PlatformOps]
      operationId: closePlatformMaintenanceWindow
      description: Closes the current maintenance window and restores normal HTTP mutation handling.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: maintenance_key
          required: true
          schema: {type: string, pattern: '^maintenance_[a-f0-9]{32}$'}
        - in: header
          name: If-Match
          required: true
          schema: {type: string, pattern: '^"rev-[0-9]+"$'}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 8, maxLength: 200}
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
        '400': {$ref: '#/components/responses/ApiResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
        '403': {$ref: '#/components/responses/ApiResponse'}
        '409': {$ref: '#/components/responses/ApiResponse'}
  /api/platform/v1/ops/tasks/backup:
    post:
      tags: [PlatformOps]
      operationId: submitPlatformBackup
      description: >-
        Submits the single registered paired DB/files backup. Host, database,
        path, command, credential and retry fields are not accepted.
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 8, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformBackupRequest'}
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
        '400': {$ref: '#/components/responses/ApiResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
        '403': {$ref: '#/components/responses/ApiResponse'}
        '409': {$ref: '#/components/responses/ApiResponse'}
  /api/platform/v1/ops/tasks/restore:
    post:
      tags: [PlatformOps]
      operationId: submitPlatformRestoreVerification
      description: >-
        Restores one verified paired backup to the registered isolated target,
        verifies data and files, then removes only that target. Host, database,
        path, command, credential and retry fields are not accepted.
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 8, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformRestoreVerificationRequest'}
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
        '400': {$ref: '#/components/responses/ApiResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
        '403': {$ref: '#/components/responses/ApiResponse'}
        '409': {$ref: '#/components/responses/ApiResponse'}
  /api/platform/v1/ops/tasks/upgrade:
    post:
      tags: [PlatformOps]
      operationId: submitPlatformUpgradeExecution
      description: >-
        Submits the sole fixed application-upgrade workflow. Source and target
        identities come from current Runtime plus the deployment-staged PC41
        descriptor. The request cannot provide a path, URL, command, Release,
        image, credential, retry count or deployment target.
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 8, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
        '400': {$ref: '#/components/responses/ApiResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
        '403': {$ref: '#/components/responses/ApiResponse'}
        '409': {$ref: '#/components/responses/ApiResponse'}
  /api/platform/v1/ops/tasks/{task_key}:
    get:
      tags: [PlatformOps]
      operationId: getPlatformOpsTask
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: task_key
          required: true
          schema: {type: string, pattern: '^job_[a-f0-9]{32}$'}
      responses:
        '200': {$ref: '#/components/responses/ApiResponse'}
        '401': {$ref: '#/components/responses/ApiResponse'}
        '403': {$ref: '#/components/responses/ApiResponse'}
        '404': {$ref: '#/components/responses/ApiResponse'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageNo:
      in: query
      name: page_no
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      in: query
      name: page_size
      schema: {type: integer, minimum: 1, maximum: 200, default: 15}
  schemas:
    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account: {type: string, minLength: 1}
        password: {type: string, minLength: 1, format: password}
        terminal: {type: integer, minimum: 1}
    TenantSelectRequest:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: {type: integer, minimum: 1}
    PlatformMaintenanceScheduleRequest:
      type: object
      additionalProperties: false
      required: [reason_key, starts_at, ends_at]
      properties:
        reason_key:
          type: string
          enum: [planned-upgrade, database-maintenance, security-maintenance]
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
    PlatformBackupRequest:
      type: object
      additionalProperties: false
      required: [provider_key]
      properties:
        provider_key:
          type: string
          enum: [peanut.paired-db-files]
    PlatformRestoreVerificationRequest:
      type: object
      additionalProperties: false
      required: [provider_key, backup_reference_key, target_key]
      properties:
        provider_key:
          type: string
          enum: [peanut.paired-db-files]
        backup_reference_key:
          type: string
          pattern: '^backup_[a-f0-9]{32}$'
        target_key:
          type: string
          enum: [isolated-new-target]
    PlatformProviderQualificationResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/PlatformProviderQualificationSnapshot'}
    PlatformProviderQualificationSnapshot:
      type: object
      additionalProperties: false
      required: [schema_version, generated_at, providers]
      properties:
        schema_version: {type: integer, enum: [1]}
        generated_at: {type: string, format: date-time}
        providers:
          type: array
          items: {$ref: '#/components/schemas/PlatformProviderQualification'}
    PlatformProviderQualification:
      type: object
      additionalProperties: false
      required:
        - provider_key
        - category
        - scope
        - configured
        - connected
        - callback_verified
        - credential_rotated_at
        - observed_at
        - expires_at
        - qualified
        - status_code
        - recent_failure
        - evidence_digest
      properties:
        provider_key: {type: string, pattern: '^[a-z][a-z0-9._-]{2,95}$'}
        category: {type: string, enum: [payment, notification, oauth, storage]}
        scope:
          type: object
          additionalProperties: false
          required: [type, key]
          properties:
            type: {type: string, enum: [tenant, instance]}
            key: {type: string, pattern: '^scope_[a-f0-9]{64}$'}
        configured: {type: boolean}
        connected: {type: boolean}
        callback_verified: {type: boolean}
        credential_rotated_at: {type: string, format: date-time, nullable: true}
        observed_at: {type: string, format: date-time, nullable: true}
        expires_at: {type: string, format: date-time, nullable: true}
        qualified: {type: boolean}
        status_code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,95}$'}
        recent_failure:
          nullable: true
          allOf:
            - type: object
              additionalProperties: false
              required: [code, observed_at]
              properties:
                code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,95}$'}
                observed_at: {type: string, format: date-time}
        evidence_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    ReadinessChecklistResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ReadinessChecklist'}
    ReadinessChecklist:
      type: object
      required: [production_ready, summary, items]
      properties:
        production_ready: {type: boolean}
        summary:
          type: object
          additionalProperties: {type: integer, minimum: 0}
        items:
          type: array
          items: {$ref: '#/components/schemas/ReadinessItem'}
    ReadinessItem:
      type: object
      required:
        - key
        - scope
        - status
        - verification_level
        - impact_key
        - action_key
        - entry
        - production_blocking
        - facts
      properties:
        key:
          type: string
          enum: [brand, notification, storage, backup, worker, domain_tls, account_security]
        scope: {type: string, enum: [tenant, instance]}
        status:
          type: string
          enum: [configured, observed, action_required, unverified, not_implemented]
        verification_level: {type: string}
        impact_key: {type: string}
        action_key: {type: string}
        entry:
          type: object
          required: [kind, route, audience]
          properties:
            kind: {type: string, enum: [route, owner]}
            route: {type: string, nullable: true}
            audience:
              type: string
              enum: [tenant_admin, platform_operator, deployment_owner]
        production_blocking: {type: boolean}
        facts:
          type: object
          additionalProperties: true
    ApiResponse:
      type: object
      additionalProperties: true
      properties:
        code: {type: integer}
        show: {type: boolean}
        msg: {type: string}
        data: {}
  responses:
    ApiResponse:
      description: Standard Peanut Admin API response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiResponse'}
